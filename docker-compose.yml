services:

  reviewpulse:

    build: .

    container_name: reviewpulse

    ports:
      - "8000:8000"

    environment:

      MODEL_DIR: /app/model/itransformer

      DATA_PATH: /app/data/latest_168h.csv

    restart: unless-stopped

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]

      interval: 30s

      timeout: 10s

      retries: 3